name: govulncheck
# Known vulnerabilities in the code this fork builds and the modules it requires. Upstream Gio
# publishes no advisories, so this is the fork's security watch (UPSTREAM.md, 'Security').
on:
  pull_request:
  push:
    branches: [main]
  # Weekly: a new advisory can name a module that did not change.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
jobs:
  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        # govulncheck reports for the GOOS it runs on: the platforms consumers ship on, Windows
        # included (AutoDoc v0.2 adds it).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Linux window-system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      # v1.7.0 is the newest release that builds with Go 1.25, the toolchain the fork and its
      # consumers use; a later one would switch toolchains and report on another standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
